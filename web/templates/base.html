<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/output.css') }}">
    <script src="{{ url_for('static', path='js/htmx.min.js') }}" defer></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full min-h-screen flex flex-col bg-gray-50 text-gray-900 antialiased">

    {% include "partials/nav.html" %}

    <main class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
