<nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="flex items-center justify-between h-16 gap-4">

            <a href="/" class="flex items-center gap-2 font-semibold text-gray-900 shrink-0">
                <span aria-hidden="true">📚</span>
                <span class="hidden sm:inline">{{ settings.app_name }}</span>
            </a>

            <div class="flex items-center gap-0.5 sm:gap-1 overflow-x-auto">
                {% for link in nav_links %}
                <a
                    href="{{ link.href }}"
                    class="px-2 sm:px-3 py-2 rounded-md text-xs sm:text-sm font-medium whitespace-nowrap transition-colors
                        {% if request.url.path == link.href %}
                            text-indigo-600 bg-indigo-50
                        {% else %}
                            text-gray-600 hover:text-gray-900 hover:bg-gray-50
                        {% endif %}"
                >
                    {{ link.label }}
                </a>
                {% endfor %}

                <a
                    href="{{ settings.github_url }}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="px-2 sm:px-3 py-2 rounded-md text-xs sm:text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition-colors flex items-center gap-1 whitespace-nowrap"
                >
                    GitHub
                    <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                </a>
            </div>

        </div>
    </div>
</nav>
