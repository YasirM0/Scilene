{#
    #85's idea-input step. Reused for both the modal's initial state
    and "← Start over" after reviewing a generated result -- always
    the same form, just optionally pre-filled with what was typed
    last time.
#}
{% set locale = request.state.locale %}
<form hx-post="/research-idea/generate" hx-target="#research-idea-body" hx-swap="innerHTML">
    <label for="research-idea-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        {{ t("research_idea_form.label", locale) }}
    </label>
    <textarea
        id="research-idea-input" name="idea" rows="5"
        placeholder="{{ t('research_idea_form.placeholder', locale) }}"
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-horizon-500 focus:border-horizon-500"
    >{{ idea or "" }}</textarea>
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
        {{ t("research_idea_form.helper", locale) }}
    </p>
    <button type="submit"
        class="mt-3 px-4 py-2 text-sm font-medium rounded-md bg-navy-600 text-white hover:bg-navy-700"
    >{{ t("research_idea_form.generate_button", locale) }}</button>
</form>
