{% macro recommendation_badge(confidence) %}
<div class="flex flex-col items-end gap-0.5">
    <span class="px-2 py-0.5 rounded-full text-xs font-medium {{ confidence_colors.get(confidence, 'bg-gray-100 text-gray-600') }}">
        {{ confidence }}
    </span>
    <span class="text-xs text-gray-400" aria-hidden="true">{{ confidence_stars.get(confidence, '') }}</span>
</div>
{% endmacro %}
