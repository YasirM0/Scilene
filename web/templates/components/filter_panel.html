<details class="bg-white rounded-lg border border-gray-200 group" open>
    <summary class="cursor-pointer list-none px-4 py-3 flex items-center justify-between">
        <span class="text-base font-semibold text-gray-800">⚙️ Publication Preferences</span>
        <span class="text-gray-400 transition-transform group-open:rotate-90">▶</span>
    </summary>

    <div class="px-4 pb-4 space-y-4 border-t border-gray-100 pt-4">

        <div>
            <label for="strategy_label" class="block text-sm font-medium text-gray-700 mb-1">Recommendation Strategy</label>
            <select id="strategy_label" name="strategy_label"
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-horizon-500 focus:border-horizon-500">
                {% for label in strategy_labels %}
                <option value="{{ label }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="language" class="block text-sm font-medium text-gray-700 mb-1">Preferred Language</label>
                <select id="language" name="language"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-horizon-500 focus:border-horizon-500">
                    <option value="Any">Any</option>
                    <option value="English">English</option>
                    <option value="Indonesian">Indonesian</option>
                </select>
            </div>

            <div>
                <label for="budget_choice" class="block text-sm font-medium text-gray-700 mb-1">Publication Budget</label>
                <select id="budget_choice" name="budget_choice"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-horizon-500 focus:border-horizon-500">
                    {% for option in budget_options %}
                    <option value="{{ option }}">{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label for="review_time_choice" class="block text-sm font-medium text-gray-700 mb-1">Maximum Review Time</label>
            <select id="review_time_choice" name="review_time_choice"
                class="w-full sm:w-1/2 px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-horizon-500 focus:border-horizon-500">
                {% for option in review_time_options %}
                <option value="{{ option }}">{{ option }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t border-gray-100">
            <div>
                <p class="block text-sm font-medium text-gray-700 mb-2">Preferred Indexing</p>
                <div class="space-y-1">
                    {% for option in indexing_options %}
                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input type="checkbox" name="indexing" value="{{ option }}" {% if option == "DOAJ" %}checked{% endif %}
                            class="rounded border-gray-300 text-horizon-600 focus:ring-horizon-500">
                        {{ option }}
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div>
                <p class="block text-sm font-medium text-gray-700 mb-2">Scopus / WoS Quartile</p>
                <div class="space-y-1">
                    {% for option in quartile_options %}
                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input type="checkbox" name="quartiles" value="{{ option }}"
                            class="rounded border-gray-300 text-horizon-600 focus:ring-horizon-500">
                        {{ option }}
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div>
                <p class="block text-sm font-medium text-gray-700 mb-2">SINTA Level</p>
                <div class="space-y-1 max-h-28 overflow-y-auto pr-2">
                    {% for option in sinta_level_options %}
                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input type="checkbox" name="sinta_levels" value="{{ option }}"
                            class="rounded border-gray-300 text-horizon-600 focus:ring-horizon-500">
                        {{ option }}
                    </label>
                    {% endfor %}
                </div>
            </div>
        </div>

    </div>
</details>
