<div>
    <h2 class="text-base font-semibold text-gray-800 mb-3">📄 Enter Manuscript Information</h2>

    <div class="space-y-4">
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Paper Title *</label>
            <input
                type="text" id="title" name="title" required
                placeholder="Enter your manuscript title..."
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            >
        </div>

        <div>
            <label for="abstract" class="block text-sm font-medium text-gray-700 mb-1">Abstract *</label>
            <textarea
                id="abstract" name="abstract" required rows="6"
                placeholder="Paste your manuscript abstract here..."
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            ></textarea>
            <p class="text-xs text-gray-400 mt-1">Your abstract helps identify suitable journals when keywords are left blank.</p>
        </div>

        <div>
            <label for="keywords" class="block text-sm font-medium text-gray-700 mb-1">Keywords (Optional)</label>
            <input
                type="text" id="keywords" name="keywords"
                placeholder="digital governance, e-government, Indonesia"
                class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            >
            <p class="text-xs text-gray-400 mt-1">Separate keywords using commas (,) or semicolons (;).</p>
        </div>
    </div>
</div>
