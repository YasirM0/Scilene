{% macro index_badge(name, count) %}
{% set locale = request.state.locale %}
<div class="flex items-center justify-between px-4 py-3 bg-white rounded-lg border border-gray-200 dark:bg-gray-800 dark:border-gray-700">
    <span class="font-medium text-gray-900 dark:text-gray-50">{{ name }}</span>
    <span class="text-sm text-gray-500 dark:text-gray-400">{{ t("index_badge.journals_suffix", locale, count="{:,}".format(count)) }}</span>
</div>
{% endmacro %}
