{% macro stat_card(value, label) %}
<div class="text-center px-4 py-6 bg-white rounded-lg border border-gray-200 dark:bg-gray-800 dark:border-gray-700">
    <p class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-gray-50">{{ value }}</p>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">{{ label }}</p>
</div>
{% endmacro %}
