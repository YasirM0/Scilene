{% macro pagination(page, total_pages, show_weaker) %}
{% set locale = request.state.locale %}
{% set weaker_param = "&show_weaker=on" if show_weaker else "" %}
<div class="flex items-center justify-between mt-4">
    <button
        {% if page <= 1 %}disabled{% endif %}
        hx-get="/search/results?page={{ page - 1 }}{{ weaker_param }}"
        hx-target="#results-panel"
        hx-swap="innerHTML"
        class="px-3 py-1.5 text-sm rounded-md border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-horizon-500 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white dark:disabled:hover:bg-gray-900 transition"
    >
        {{ t("pagination.previous", locale) }}
    </button>

    <span class="text-sm text-gray-500 dark:text-gray-400">{{ t("pagination.page_of", locale, page=page, total=total_pages) }}</span>

    <button
        {% if page >= total_pages %}disabled{% endif %}
        hx-get="/search/results?page={{ page + 1 }}{{ weaker_param }}"
        hx-target="#results-panel"
        hx-swap="innerHTML"
        class="px-3 py-1.5 text-sm rounded-md border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-horizon-500 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white dark:disabled:hover:bg-gray-900 transition"
    >
        {{ t("pagination.next", locale) }}
    </button>
</div>
{% endmacro %}
