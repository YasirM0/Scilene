  <rect x="900" y="246" width="32" height="14" rx="7" fill="#10b981" fill-opacity="0.2"/>
  <text x="916" y="257" text-anchor="middle" font-size="9" fill="#10b981">Q1</text>
  <rect x="938" y="246" width="34" height="14" rx="7" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="955" y="257" text-anchor="middle" font-size="9" fill="#f59e0b">DOAJ</text>
  <rect x="978" y="246" width="68" height="14" rx="7" fill="#10b981" fill-opacity="0.1"/>
  <text x="1012" y="257" text-anchor="middle" font-size="9" fill="#10b981">Open Access</text>
  <text x="900" y="272" font-size="10" fill="#475569">↳ Strong scope match, no APC barrier</text>

  <!-- Journal result card 3 -->
  <rect x="886" y="286" width="250" height="42" rx="8" fill="#0a1525" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="886" y="286" width="4" height="42" rx="2" fill="#818cf8"/>
  <text x="900" y="304" font-size="11" font-weight="600" fill="#f1f5f9">Scientific Reports</text>
