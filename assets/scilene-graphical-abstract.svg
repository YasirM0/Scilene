<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0d1a2e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#131f35"/>
      <stop offset="100%" style="stop-color:#0f1a2e"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#1e2d45" stroke-width="1"/>
  <line x1="0" y1="499" x2="1200" y2="499" stroke="#1e2d45" stroke-width="1"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#titleGrad)"/>

  <!-- Header -->
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="url(#titleGrad)">Scilene</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#64748b" letter-spacing="3">OPEN-SOURCE JOURNAL DISCOVERY PLATFORM</text>

  <!-- Divider -->
  <line x1="200" y1="88" x2="1000" y2="88" stroke="#1e2d45" stroke-width="1"/>

  <!-- ─────────────── PANEL 1: INPUT ─────────────── -->
  <rect x="40" y="108" width="290" height="290" rx="14" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.2"/>

  <!-- Panel 1 label -->
  <text x="185" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">INPUT</text>

  <!-- Document icon -->
