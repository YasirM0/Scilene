  <text x="900" y="170" font-size="11" font-weight="600" fill="#f1f5f9">Nature Communications</text>
  <rect x="900" y="178" width="32" height="14" rx="7" fill="#10b981" fill-opacity="0.2"/>
  <text x="916" y="189" text-anchor="middle" font-size="9" fill="#10b981">Q1</text>
  <rect x="938" y="178" width="42" height="14" rx="7" fill="#38bdf8" fill-opacity="0.15"/>
  <text x="959" y="189" text-anchor="middle" font-size="9" fill="#38bdf8">Scopus</text>
  <rect x="986" y="178" width="36" height="14" rx="7" fill="#818cf8" fill-opacity="0.15"/>
  <text x="1004" y="189" text-anchor="middle" font-size="9" fill="#818cf8">WoS</text>
  <text x="900" y="204" font-size="10" fill="#475569">↳ Matches your methodology and scope</text>

  <!-- Journal result card 2 -->
  <rect x="886" y="218" width="250" height="60" rx="8" fill="#0a1525" stroke="#1e3a5f" stroke-width="1"/>
