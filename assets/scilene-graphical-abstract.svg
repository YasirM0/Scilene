  <!-- More -->
  <text x="1011" y="352" text-anchor="middle" font-size="10" fill="#334155">+ more ranked matches with explanations</text>
  <text x="1011" y="375" text-anchor="middle" font-size="10" fill="#1e3a5f">PDF · DOCX · XLSX · CSV exports</text>

  <!-- ─────────────── FOOTER ─────────────── -->
  <rect x="40" y="420" width="1120" height="52" rx="10" fill="#0d1a2e" stroke="#1e2d45" stroke-width="1"/>
  <text x="600" y="440" text-anchor="middle" font-size="11" fill="#475569" letter-spacing="1">WHY SCILENE?</text>
  <text x="600" y="460" text-anchor="middle" font-size="12" fill="#64748b">Unlike opaque rankers, every recommendation comes with a plain-language explanation  ·  MIT License  ·  github.com/YasirM0/Scilene</text>

</svg>
