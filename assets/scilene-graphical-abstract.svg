  <rect x="527" y="283" width="68" height="22" rx="11" fill="#0a1525" stroke="#1e3a5f" stroke-width="1"/>
  <text x="561" y="298" text-anchor="middle" font-size="10" fill="#38bdf8">Language</text>

  <!-- Stack -->
  <text x="598" y="336" text-anchor="middle" font-size="11" fill="#334155">Python · FastAPI · HTMX · SQLite · Tailwind CSS</text>
  <text x="598" y="356" text-anchor="middle" font-size="11" fill="#334155">Offline-first · Modular · Privacy by default</text>
  <text x="598" y="376" text-anchor="middle" font-size="11" fill="#1e3a5f">scilene.yasirmo.me</text>

  <!-- Arrow 2 -->
