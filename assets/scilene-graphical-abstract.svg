  <rect x="130" y="153" width="110" height="30" rx="8" fill="#0f2744"/>
  <rect x="130" y="168" width="110" height="15" fill="#0f2744"/>
  <text x="185" y="172" text-anchor="middle" font-size="10" fill="#38bdf8" font-weight="600">MANUSCRIPT</text>

  <!-- Lines in document -->
  <rect x="148" y="198" width="74" height="5" rx="2" fill="#1e3a5f"/>
  <rect x="148" y="210" width="66" height="5" rx="2" fill="#1e3a5f"/>
  <rect x="148" y="222" width="74" height="5" rx="2" fill="#1e3a5f"/>
  <rect x="148" y="234" width="50" height="5" rx="2" fill="#1e3a5f"/>
  <rect x="148" y="246" width="74" height="5" rx="2" fill="#1e3a5f"/>
  <rect x="148" y="258" width="60" height="5" rx="2" fill="#1e3a5f"/>
  <rect x="148" y="270" width="74" height="5" rx="2" fill="#1e3a5f"/>

  <text x="185" y="312" text-anchor="middle" font-size="12" fill="#94a3b8">Title</text>
